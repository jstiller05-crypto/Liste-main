<!DOCTYPE html>
<html lang="de">
<head>

  <script defer src="more.js"></script>
  <link rel="icon" type="image/x-icon" href="../icons/S logo.ico">
  <title>figcaption</title>
</head>
<body>
  <header>
    <h1>&lt;figcaption&gt;</h1>
  </header>
  <main>
    <section>
      <h2>Was ist das?</h2>
      <p>Beschriftung für Inhalte innerhalb eines &lt;figure&gt;-Elements.</p>
    </section>
    <section>
      <h2>Beispiel</h2>
      <pre><code>&lt;figure&gt;
  &lt;img src="img.png" alt="..."&gt;
  &lt;figcaption&gt;Bildbeschreibung&lt;/figcaption&gt;
&lt;/figure&gt;</code></pre>
    </section>
  </main>
  <footer>

  </footer>
</body>
