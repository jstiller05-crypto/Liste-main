  <title>dl</title>

<body>
  <header>
    <h1>&lt;dl&gt;</h1>
  </header>
  <main>
    <section>
      <h2>Was ist das?</h2>
      <p>Definitionsliste mit Begriff (`&lt;dt&gt;`) und Beschreibung (`&lt;dd&gt;`).</p>
    </section>
    <section>
      <h2>Beispiel</h2>
      <pre><code>&lt;dl&gt;
  &lt;dt&gt;HTML&lt;/dt&gt;
  &lt;dd&gt;Sprache des Webs&lt;/dd&gt;
&lt;/dl&gt;</code></pre>
    </section>
  </main>
