        <h1>Listen</h1>

    <main>
        <section>
            <h2>Was ist das?</h2>
            <p>Das &lt;li&gt;-Element definiert einzelne Einträge in Listen (&lt;ul&gt; oder &lt;ol&gt;).</p>
        </section>

        <section>
            <h2>Beispiel</h2>
            <pre><code>&lt;ul&gt;
    &lt;li&gt;Punkt 1&lt;/li&gt;
    &lt;li&gt;Punkt 2&lt;/li&gt;
&lt;/ul&gt;</code></pre>
        </section>
    </main>
