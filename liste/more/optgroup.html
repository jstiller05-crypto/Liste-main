<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script defer src="more.js"></script>
  <link rel="icon" type="image/x-icon" href="../icons/S logo.ico">
  <title>optgroup</title>
</head>
<body>
  <header>
    <h1>&lt;optgroup&gt;</h1>
  </header>
  <main>
    <section>
      <h2>Was ist das?</h2>
      <p>Gruppiert Optionen innerhalb eines &lt;select&gt;-Elements (mit Label).</p>
    </section>
    <section>
      <h2>Beispiel</h2>
      <pre><code>&lt;select&gt;
  &lt;optgroup label="Gruppe A"&gt;
    &lt;option&gt;A1&lt;/option&gt;
  &lt;/optgroup&gt;
&lt;/select&gt;</code></pre>
    </section>
  </main>
  <footer>
    <a class="back-icon" href="../Spicker.html"><img src="../icons/Back2.ico" alt="Zurück"></a>
  </footer>
</body>
