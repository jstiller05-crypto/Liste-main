<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="more.css">
    <script defer src="more.js"></script>
    <link rel="icon" type="image/x-icon" href="../icons/S logo.ico">
    <title>Button</title>
</head>
<body>
    <header>
        <h1>Der &lt;button&gt;</h1>
    </header>

    <main>
        <section>
            <h2>Was ist das?</h2>
            <p>Ein &lt;button&gt; ist eine interaktive Schaltfläche für Benutzeraktionen.</p>
        </section>

        <section>
            <h2>Syntax</h2>
            <pre><code>&lt;button type="button"&gt;Klick mich&lt;/button&gt;</code></pre>
        </section>

        <section>
            <h2>Beispiel</h2>
            <pre><code>&lt;button&gt;Moin&lt;/button&gt;</code></pre>
            <p>Der Button kann mit JavaScript verknüpft werden, um Aktionen auszuführen.</p>
        </section>
    </main>

    <footer>
        <a class="back-icon" href="../Spicker.html"><img src="../icons/Back2.ico" alt="Zurück"></a>
    </footer>
</body>
</html>
