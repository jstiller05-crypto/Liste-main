<body>
  <header>
    <h1>&lt;form&gt;</h1>
  </header>
  <main>
    <section>
      <h2>Was ist das?</h2>
      <p>Container für Eingabefelder, Buttons und Abschicken von Daten (Action / Method).</p>
    </section>
    <section>
      <h2>Beispiel</h2>
      <pre><code>&lt;form action="/submit" method="post"&gt;
  &lt;input name="name"&gt;
  &lt;button type="submit"&gt;Senden&lt;/button&gt;
&lt;/form&gt;</code></pre>
    </section>
  </main>
