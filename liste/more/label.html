  <title>label</title>

<body>
  <header>
    <h1>&lt;label&gt;</h1>
  </header>
  <main>
    <section>
      <h2>Was ist das?</h2>
      <p>Beschriftet Formularfelder; mit `for` kann es einem Input zugeordnet werden.</p>
    </section>
    <section>
      <h2>Beispiel</h2>
      <pre><code>&lt;label for="name"&gt;Name&lt;/label&gt;
&lt;input id="name" name="name"&gt;</code></pre>
    </section>
  </main>
