  <header>
    <h1>&lt;table&gt;</h1>
  </header>
  <main>
    <section>
      <h2>Was ist das?</h2>
      <p>Struktur für tabellarische Daten mit &lt;thead&gt;, &lt;tbody&gt; und &lt;tfoot&gt;.</p>
    </section>
    <section>
      <h2>Beispiel</h2>
      <pre><code>&lt;table&gt;
  &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Name&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
  &lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Wert&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;
&lt;/table&gt;</code></pre>
    </section>
  </main>
