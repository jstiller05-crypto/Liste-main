<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script defer src="more.js"></script>
  <link rel="icon" type="image/x-icon" href="../icons/S logo.ico">
  <title>datalist</title>
</head>
<body>
  <header>
    <h1>&lt;datalist&gt;</h1>
  </header>
  <main>
    <section>
      <h2>Was ist das?</h2>
      <p>Definiert eine Liste von Vorschlägen für ein &lt;input&gt; mit `list`-Attribut.</p>
    </section>
    <section>
      <h2>Beispiel</h2>
      <pre><code>&lt;input list="browsers"&gt;
&lt;datalist id="browsers"&gt;
  &lt;option value="Firefox"&gt;
  &lt;option value="Chrome"&gt;
&lt;/datalist&gt;</code></pre>
    </section>
  </main>
  <footer>
    <a class="back-icon" href="../Spicker.html"><img src="../icons/Back2.ico" alt="Zurück"></a>
  </footer>
</body>
</html>
