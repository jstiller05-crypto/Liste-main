  <header>
    <h1>&lt;object&gt;</h1>
  </header>
  <main>
    <section>
      <h2>Was ist das?</h2>
      <p>Einbettung von externen Ressourcen wie PDFs oder Multimedia (Alternative zu &lt;embed&gt;).</p>
    </section>
    <section>
      <h2>Beispiel</h2>
      <pre><code>&lt;object data="file.pdf" type="application/pdf" width="600" height="400"&gt;PDF nicht verfügbar&lt;/object&gt;</code></pre>
    </section>
  </main>
