    <h1>&lt;meter&gt;</h1>
  </header>
  <main>
    <section>
      <h2>Was ist das?</h2>
      <p>Zeigt eine Messung innerhalb eines Bereichs (z. B. Auslastung).</p>
    </section>
    <section>
      <h2>Beispiel</h2>
      <pre><code>&lt;meter value="0.6" min="0" max="1"&gt;60%&lt;/meter&gt;</code></pre>
    </section>
