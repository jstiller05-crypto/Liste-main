<body>
  <header>
    <h1>&lt;canvas&gt;</h1>
  </header>
  <main>
    <section>
      <h2>Was ist das?</h2>
      <p>Zeichenfläche für 2D/3D-Grafiken mittels JavaScript (Canvas API).</p>
    </section>
    <section>
      <h2>Beispiel</h2>
      <pre><code>&lt;canvas id="c" width="300" height="150"&gt;&lt;/canvas&gt;
&lt;script&gt;const ctx = document.getElementById('c').getContext('2d');ctx.fillRect(10,10,50,50);&lt;/script&gt;</code></pre>
    </section>
  </main>
