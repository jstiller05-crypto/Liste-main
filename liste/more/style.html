<!DOCTYPE html>

  <title>style</title>

<body>
  <header>
    <h1>&lt;style&gt;</h1>
  </header>
  <main>
    <section>
      <h2>Was ist das?</h2>
      <p>Schreibt CSS direkt im HTML-Dokument innerhalb des &lt;head&gt;.</p>
    </section>
    <section>
      <h2>Beispiel</h2>
      <pre><code>&lt;style&gt;
  body { background: #000; color:#fff; }
&lt;/style&gt;</code></pre>
    </section>
  </main>
