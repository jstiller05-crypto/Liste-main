<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="Spicker.css">
    <script src="spicker.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="icons/S logo.ico">
    <title>liste Tags</title>    
</head>
<body>
    <header>
        <div>
            <input type="text" id="myInput" onchange="myFunction()" placeholder="Search for tags.." title="if you read this, you are an GitHub user">

            <div class="class-dropdown">
                <div class="dropdown-language-content">
                    <div>
                        <div class="button">
                            HTML
                        </div>
                        <div class="button">
                            CSS
                        </div>
                        <div class="button">
                            JavaScript
                        </div>
                        <div class="button">
                            PHP
                        </div>
                        <div class="button">
                            SQL
                        </div>
                    </div>

                </div>

                <div class="dropdown-info-content">
                    <div>
                        <div class="button">
                            Info
                        </div>
                        <div class="button">
                            Design
                        </div>
                        <div class="button">
                            Funktion
                        </div>
                        <div class="button">
                            API
                        </div>
                        <div class="button">
                            Sonstiges
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>
    <main>
        <table id="dynamicTable">
        <thead> 
            <tr> 
                <th>Tag</th> 
                <th>Beschreibung</th>
                <th>Sprache</th> 
                <th>Link</th> 
            </tr>
        </thead> 
        <tbody>

        </tbody> 
    </table>
    <div id="noResultsOverlay">
        <div class="overlay-content">
        Keine Ergebnisse gefunden!
        </div>
    </div>
    </main>
    <footer>
        <div class="ersteller">
            <p>Erstellt von:</p><a href="https://github.com/jstiller05-crypto">Julian Stiller</a>
        </div>
    </footer>
</body>
</html>
