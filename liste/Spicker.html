<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="Spicker.css">
    <script src="spicker.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="icons/S logo.ico">
    <title>liste Tags</title>    
</head>
<body>
    <!-- =====================================================
         HEADER
         Links: Logo + Titel | Rechts: Suche mit Filter-Dropdown
         Das Dropdown öffnet sich, solange etwas in .search-area
         fokussiert ist (CSS :focus-within).
         ===================================================== -->
    <header class="site-header">
        <div class="header-inner">

            <!-- ----- Logo + Titel ----- -->
            <div class="brand">
                <!-- onerror: Falls das Icon nicht lädt → ausblenden + in der Konsole melden -->
                <img class="brand-logo" src="icons/S logo.ico" alt=""
                     onerror="console.warn('[header] Logo konnte nicht geladen werden:', this.src); this.style.display='none';">
                <div>
                    <h1 class="brand-title">Spicker</h1>
                    <span class="brand-subtitle">Alles, was ich gelernt habe</span>
                </div>
            </div>

            <!-- ----- Suche + Dropdown ----- -->
            <div class="search-area">
                <div class="search-box">
                    <!-- Lupen-Symbol als SVG (braucht keine Datei) -->
                    <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="11" cy="11" r="7"></circle>
                        <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
                    </svg>
                    <input type="text" id="myInput" placeholder="Tags, Beschreibungen oder Sprachen suchen …" autocomplete="off" title="if you read this, you are an GitHub user">
                </div>

                <div class="class-dropdown">

                    <!-- Gruppe 1: Sprache -->
                    <div class="filter-group">
                        <p class="filter-title">Sprache</p>
                        <div class="chip-row">
                            <button type="button" class="button language-btn active" data-language="">Alle</button>
                            <button type="button" class="button language-btn" data-language="html">HTML</button>
                            <button type="button" class="button language-btn" data-language="css">CSS</button>
                            <button type="button" class="button language-btn" data-language="js">JavaScript</button>
                            <button type="button" class="button language-btn" data-language="c++">C++</button>
                            <button type="button" class="button language-btn" data-language="node.js">Node.js</button>
                            <button type="button" class="button language-btn" data-language="sql">SQL</button>
                            <button type="button" class="button language-btn" data-language="php">PHP</button>
                            <button type="button" class="button language-btn" data-language="lua">Lua</button>
                            <button type="button" class="button language-btn" data-language="c">C</button>
                            <button type="button" class="button language-btn" data-language="c#">C#</button>
                            <button type="button" class="button language-btn" data-language="swift">Swift</button>
                            <button type="button" class="button language-btn" data-language="terminal">Terminal</button>
                        </div>
                    </div>

                    <!-- Gruppe 2: Kategorie (data-category = Wert aus dem class-Array) -->
                    <div class="filter-group">
                        <p class="filter-title">Kategorie</p>
                        <div class="chip-row">
                            <button type="button" class="button category-btn active" data-category="">Alle</button>
                            <button type="button" class="button category-btn" data-category="basis">Basis</button>
                            <button type="button" class="button category-btn" data-category="grundlagen">Grundlagen</button>
                            <button type="button" class="button category-btn" data-category="text">Text</button>
                            <button type="button" class="button category-btn" data-category="container">Container</button>
                            <button type="button" class="button category-btn" data-category="media">Medien</button>
                            <button type="button" class="button category-btn" data-category="form">Formular</button>
                            <button type="button" class="button category-btn" data-category="tabelle">Tabelle</button>
                            <button type="button" class="button category-btn" data-category="selektoren">Selektoren</button>
                            <button type="button" class="button category-btn" data-category="kontrolle">Kontrollstrukturen</button>
                            <button type="button" class="button category-btn" data-category="layout">Layout</button>
                            <button type="button" class="button category-btn" data-category="gestaltung">Gestaltung</button>
                            <button type="button" class="button category-btn" data-category="daten">Daten</button>
                            <button type="button" class="button category-btn" data-category="dom">DOM &amp; Events</button>
                            <button type="button" class="button category-btn" data-category="oop">OOP</button>
                            <button type="button" class="button category-btn" data-category="speicher">Speicher</button>
                            <button type="button" class="button category-btn" data-category="werkzeuge">Werkzeuge</button>
                            <button type="button" class="button category-btn" data-category="server">Server</button>
                        </div>
                    </div>

                    <!-- Gruppe 3: Sortierung -->
                    <div class="filter-group">
                        <label class="filter-title" for="sortSelect">Sortieren nach</label>
                        <select id="sortSelect">
                            <option value="az">A – Z</option>
                            <option value="za">Z – A</option>
                            <option value="language">Sprache</option>
                        </select>
                    </div>

                </div>
            </div>

        </div>
    </header>
    <main>
        <table id="dynamicTable">
        <thead> 
            <tr> 
                <th>Tag</th> 
                <th>Beschreibung</th>
                <th>Sprache</th> 
                <th>Link</th> 
            </tr>
        </thead> 
        <tbody>

        </tbody> 
    </table>
    <div id="noResultsOverlay">
        <div class="overlay-content">
        Keine Ergebnisse gefunden!
        </div>
    </div>
    </main>
    <footer>
        <div class="ersteller">
            <p>Erstellt von:</p><a href="https://github.com/jstiller05-crypto">Julian Stiller</a>
        </div>
    </footer>
</body>
</html>
